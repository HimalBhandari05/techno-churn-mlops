[project]
name = "telco-churn-mlops"
version = "0.1.0"
description = "Production-grade MLOps pipeline for Telco Customer Churn prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.23",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.11.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "uvicorn>=0.29.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -v"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
